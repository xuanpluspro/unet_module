<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1070" viewBox="0 0 1800 1070"><title>CAFR mapping and differences between paper and current implementation</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#435268"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:'Arial','Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#203048} .small{fill:#576579}</style><text x="65" y="52" font-size="32" text-anchor="start" font-weight="700">(b) CAFR 没有消失：论文名称与实现名称的对应</text><text x="65" y="88" font-size="21" text-anchor="start" font-weight="400">按论文方法段与已公开源码逐项比对；“对应”表示核心机制对应，不代表每一处计算完全等价。</text><rect x="65" y="120" width="535" height="118" rx="7" fill="#e1f2eb" stroke="#599c84" stroke-width="2"/><text x="332.5" y="159" font-size="21" text-anchor="middle" font-weight="600">CSSP</text><text x="332.5" y="187" font-size="21" text-anchor="middle" font-weight="400">cfb.py / CascadeFusionBlock</text><text x="332.5" y="215" font-size="21" text-anchor="middle" font-weight="400">光谱–空间级联交互</text><rect x="630" y="120" width="535" height="118" rx="7" fill="#e1f2eb" stroke="#599c84" stroke-width="2"/><text x="897.5" y="159" font-size="21" text-anchor="middle" font-weight="600">SACF</text><text x="897.5" y="187" font-size="21" text-anchor="middle" font-weight="400">ssaf.py / SpectralSpatialAdaptiveFusion</text><text x="897.5" y="215" font-size="21" text-anchor="middle" font-weight="400">邻域聚合 + 空间细节 + 跨层融合</text><rect x="1195" y="120" width="535" height="118" rx="7" fill="#e1f2eb" stroke="#599c84" stroke-width="2"/><text x="1462.5" y="159" font-size="21" text-anchor="middle" font-weight="600">CAFR</text><text x="1462.5" y="187" font-size="21" text-anchor="middle" font-weight="400">fem.py / FeatureEnhancementModule</text><text x="1462.5" y="215" font-size="21" text-anchor="middle" font-weight="400">跨层通道交叉注意力 + 特征细化</text><rect x="45" y="270" width="1710" height="460" rx="12" fill="none" stroke="#bbc4d0" stroke-width="1.4" stroke-dasharray="8 6"/><text x="75" y="308" font-size="26" text-anchor="start" font-weight="600">当前 FEM：承接 CAFR 的核心计算</text><rect x="75" y="355" width="235" height="78" rx="7" fill="#e8f1fb" stroke="#658bb5" stroke-width="2"/><text x="192.5" y="388" font-size="22" text-anchor="middle" font-weight="600">低层前景特征 L</text><text x="192.5" y="416" font-size="22" text-anchor="middle" font-weight="400">C × 2H × 2W</text><rect x="75" y="555" width="235" height="78" rx="7" fill="#e8f1fb" stroke="#658bb5" stroke-width="2"/><text x="192.5" y="588" font-size="22" text-anchor="middle" font-weight="600">高层特征 H</text><text x="192.5" y="616" font-size="22" text-anchor="middle" font-weight="400">C × H × W</text><rect x="365" y="355" width="200" height="78" rx="7" fill="#e8f1fb" stroke="#658bb5" stroke-width="2"/><text x="465" y="388" font-size="22" text-anchor="middle" font-weight="600">3×3 卷积</text><text x="465" y="416" font-size="22" text-anchor="middle" font-weight="400">stride = 2</text><path d="M310 394 L365 394" fill="none" stroke="#435268" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="630" y="355" width="220" height="78" rx="7" fill="#e8f1fb" stroke="#658bb5" stroke-width="2"/><text x="740" y="388" font-size="22" text-anchor="middle" font-weight="600">GAP + 1×1 卷积</text><text x="740" y="416" font-size="22" text-anchor="middle" font-weight="400">低层向量 vL</text><rect x="630" y="555" width="220" height="78" rx="7" fill="#e8f1fb" stroke="#658bb5" stroke-width="2"/><text x="740" y="588" font-size="22" text-anchor="middle" font-weight="600">GAP + 1×1 卷积</text><text x="740" y="616" font-size="22" text-anchor="middle" font-weight="400">高层向量 vH</text><path d="M565 394 L630 394" fill="none" stroke="#435268" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M310 594 L630 594" fill="none" stroke="#435268" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="945" y="455" width="250" height="110" rx="7" fill="#e1f2eb" stroke="#599c84" stroke-width="2"/><text x="1070" y="490" font-size="21" text-anchor="middle" font-weight="600">通道交叉注意力</text><text x="1070" y="518" font-size="21" text-anchor="middle" font-weight="400">C×C 相关矩阵</text><text x="1070" y="546" font-size="21" text-anchor="middle" font-weight="400">→ 两路通道权重</text><path d="M850 394 L895 394 L895 483 L945 483" fill="none" stroke="#435268" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M850 594 L895 594 L895 538 L945 538" fill="none" stroke="#435268" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1260" y="355" width="190" height="78" rx="7" fill="#e1f2eb" stroke="#599c84" stroke-width="2"/><text x="1355" y="388" font-size="21" text-anchor="middle" font-weight="600">低层特征</text><text x="1355" y="416" font-size="21" text-anchor="middle" font-weight="400">× 低层权重</text><rect x="1260" y="555" width="190" height="78" rx="7" fill="#e1f2eb" stroke="#599c84" stroke-width="2"/><text x="1355" y="588" font-size="21" text-anchor="middle" font-weight="600">高层特征</text><text x="1355" y="616" font-size="21" text-anchor="middle" font-weight="400">× 高层权重</text><path d="M1195 483 L1225 483 L1225 394 L1260 394" fill="none" stroke="#435268" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M1195 538 L1225 538 L1225 594 L1260 594" fill="none" stroke="#435268" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M565 394 L590 394 L590 337 L1355 337 L1355 355" fill="none" stroke="#435268" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M310 594 L335 594 L335 668 L1355 668 L1355 633" fill="none" stroke="#435268" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1510" y="445" width="205" height="130" rx="7" fill="#fff0dc" stroke="#cc9249" stroke-width="2"/><text x="1612.5" y="490" font-size="21" text-anchor="middle" font-weight="600">相加融合</text><text x="1612.5" y="518" font-size="21" text-anchor="middle" font-weight="400">3×3 Conv</text><text x="1612.5" y="546" font-size="21" text-anchor="middle" font-weight="400">BN + ReLU</text><path d="M1450 394 L1478 394 L1478 475 L1510 475" fill="none" stroke="#435268" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M1450 594 L1478 594 L1478 540 L1510 540" fill="none" stroke="#435268" stroke-width="2.2" marker-end="url(#arrow)"/><text x="75" y="704" font-size="19" text-anchor="start" font-weight="400">注意：代码额外带融合卷积；交叉矩阵的方向与 softmax 轴仍需逐式核对，不能只凭模块名宣称完全复现。</text><text x="65" y="785" font-size="27" text-anchor="start" font-weight="600">原论文与当前分割版：前景监督存在实质差异</text><rect x="65" y="810" width="795" height="125" rx="7" fill="#edf2f8" stroke="#7a8da8" stroke-width="2"/><text x="462.5" y="852.5" font-size="22" text-anchor="middle" font-weight="600">原论文：Object-aware Masking</text><text x="462.5" y="880.5" font-size="22" text-anchor="middle" font-weight="400">框生成高斯目标图；使用交集项 + 差异项的 L_act</text><text x="462.5" y="908.5" font-size="22" text-anchor="middle" font-weight="400">F̄ = F × M   →   CAFR 自底向上细化</text><rect x="910" y="810" width="825" height="125" rx="7" fill="#fff0dc" stroke="#cc9249" stroke-width="2"/><text x="1322.5" y="852.5" font-size="22" text-anchor="middle" font-weight="600">当前分割版：新增前景辅助分支</text><text x="1322.5" y="880.5" font-size="22" text-anchor="middle" font-weight="400">真实像素掩膜；辅助 BCE；主输出 CE + Dice</text><text x="1322.5" y="908.5" font-size="22" text-anchor="middle" font-weight="400">F′ = Conv(F × (1 + sigmoid(A)))   →   FEM ×3</text><text x="65" y="983" font-size="23" text-anchor="start" font-weight="600">因此，FEM 保留了 CAFR 类细化机制，但前景门控与监督已改写；当前版本属于分割适配版。</text><text x="65" y="1025" font-size="19" text-anchor="start" font-weight="400">依据：MODA 论文 Fig. 4 / CAFR 与 Object-aware Masking 方法段；仓库 fem.py、ossseg.py。</text></svg>